<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073c2e"><title>محاريب | لوحة الإدارة</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--g:#073c2e;--gold:#d6b66b;--bg:#f5f3ed;--paper:#fffdf8;--ink:#183d30;--muted:#75837b;--line:#e8e3d7;--red:#b83b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,sans-serif}button,input{font:inherit}button{cursor:pointer}.header{background:var(--g);color:white;padding:22px max(18px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center}.header h1{font-size:22px;margin:0}.header p{margin:3px 0;color:#e6d9bb;font-size:13px}.wrap{max-width:1000px;margin:auto;padding:22px 16px 60px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px #182f2010;margin-bottom:18px}.hidden{display:none!important}.btn{border:0;border-radius:11px;padding:11px 17px;font-weight:700;background:var(--g);color:white}.btn.gold{background:var(--gold);color:#183d30}.btn.red{background:#f8e8e6;color:var(--red)}.btn.light{background:#edf1ed;color:var(--g)}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-weight:700;font-size:14px}.field input{border:1px solid var(--line);border-radius:10px;background:white;padding:12px;color:var(--ink);width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted);font-size:13px}.notice{padding:12px;border-radius:10px;background:#f1f5ef;color:var(--g);margin:12px 0;font-size:14px}.notice.error{background:#fae9e7;color:var(--red)}.login{max-width:420px;margin:55px auto}.mosque{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}.mosque img{width:78px;height:65px;object-fit:cover;border-radius:10px;background:#eee}.mosque .actions{margin-right:auto;display:flex;gap:6px}.check{display:flex;align-items:center;gap:8px;margin:8px 0 15px}.check input{width:18px;height:18px}@media(max-width:620px){.grid{grid-template-columns:1fr}.mosque .actions{width:100%;margin:8px 0 0}}
</style></head><body><header class="header"><div><h1>محاريب</h1><p>لوحة إدارة المساجد</p></div><a href="./" style="color:#f1dfb7;text-decoration:none">عرض الموقع ↗</a></header><div class="wrap">
<section id="login-panel" class="panel login"><h2>تسجيل دخول المشرف</h2><p class="muted">لوحة مستقلة للمشرفين المعتمدين.</p><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><div class="row"><button class="btn" id="login-btn">تسجيل الدخول</button><button class="btn light" id="signup-btn">إنشاء حساب</button></div><div id="login-msg" class="notice hidden"></div></section>
<section id="dashboard" class="hidden"><div class="panel"><div class="row between"><div><h2 style="margin:0">إدارة المساجد</h2><p class="muted">أضف المساجد وعدّل بياناتها. المساجد النشطة تظهر للزوار.</p></div><button class="btn gold" id="new-btn">＋ إضافة مسجد</button></div><div id="admin-msg" class="notice hidden"></div><div id="mosque-list"></div></div>
<div class="panel hidden" id="form-panel"><div class="row between"><h2 id="form-title">إضافة مسجد</h2><button class="btn light" id="cancel-btn">إغلاق</button></div><form id="mosque-form"><input type="hidden" id="mid"><div class="grid">
<div class="field"><label>اسم المسجد *</label><input id="name" required maxlength="160"></div><div class="field"><label>المدينة</label><input id="city" value="الدمام"></div><div class="field"><label>الحي</label><input id="district"></div><div class="field"><label>العنوان</label><input id="address"></div><div class="field"><label>خط العرض</label><input id="lat" type="number" step="any"></div><div class="field"><label>خط الطول</label><input id="lng" type="number" step="any"></div><div class="field"><label>اسم الإمام</label><input id="imam"></div><div class="field"><label>موعد صلاة القيام في رمضان (مثال: 01:00 صباحاً)</label><input id="qiyam" placeholder="مثال: 01:00 صباحاً"></div><div class="field"><label>ترتيب العرض</label><input id="sort" type="number" value="0"></div>
<div class="field"><label>صورة المسجد</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="field"><label>صورة الإمام</label><input id="imam-photo" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="field"><label>التلاوة الصوتية</label><input id="audio" type="file" accept="audio/*"></div></div>
<label class="check"><input id="friday" type="checkbox" checked> تقام صلاة الجمعة</label><label class="check"><input id="active" type="checkbox" checked> إظهار المسجد للزوار</label><div class="row"><button class="btn" id="save" type="submit">حفظ المسجد</button><button class="btn light" type="button" id="cancel2">إلغاء</button></div></form></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://caxtxwgxpfugiviaahwx.supabase.co','sb_publishable_TSi0GlkTfXHN0ebrGru8Pg_ANNWLbzF'),$=id=>document.getElementById(id);let user=null,rows=[];
function msg(id,t,bad){$(id).textContent=t;$(id).classList.remove('hidden','error');if(bad)$(id).classList.add('error')}
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function auth(signup){let email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password){msg('login-msg','أدخل البريد وكلمة المرور',true);return}let r=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(r.error){msg('login-msg',r.error.message,true);return}if(signup&&!r.data.session){msg('login-msg','تم إنشاء الحساب. أكّد بريدك ثم سجّل الدخول. يجب اعتماد البريد كمشرف قبل إدارة المساجد.',false);return}user=r.data.user;await dashboard()}
$('login-btn').onclick=()=>auth(false);$('signup-btn').onclick=()=>auth(true);
async function dashboard(){if(!user)return;let r=await db.from('mosques').select('*').order('sort_order').order('name');if(r.error){$('login-panel').classList.remove('hidden');msg('login-msg','الحساب غير معتمد كمشرف أو تعذّر الاتصال. تواصل مع مسؤول النظام لاعتماد بريدك.',true);await db.auth.signOut();return}rows=r.data||[];$('login-panel').classList.add('hidden');$('dashboard').classList.remove('hidden');render()}
function render(){let el=$('mosque-list');if(!rows.length){el.innerHTML='<p class="muted">لا توجد مساجد بعد.</p>';return}el.innerHTML=rows.map(m=>'<div class="mosque"><img src="'+safe(m.image_url||'')+'"><div style="flex:1"><b>'+safe(m.name)+'</b><div class="muted">'+safe([m.city,m.district].filter(Boolean).join(' · '))+' · '+(m.active?'ظاهر':'مخفي')+'</div></div><div class="actions"><button class="btn light" data-edit="'+m.id+'">تعديل</button><button class="btn red" data-del="'+m.id+'">حذف</button></div></div>').join('');el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(rows.find(m=>m.id===b.dataset.edit)));el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del))}
function open(m){$('form-panel').classList.remove('hidden');$('mosque-form').reset();$('form-title').textContent=m?'تعديل المسجد':'إضافة مسجد';$('mid').value=m?.id||'';$('name').value=m?.name||'';$('city').value=m?.city||'الدمام';$('district').value=m?.district||'';$('address').value=m?.address||'';$('lat').value=m?.latitude??'';$('lng').value=m?.longitude??'';$('imam').value=m?.imam_name||'';$('qiyam').value=(m?.qiyam_start_time||'').replace(/^رمضان فقط\s*[—-]\s*/,'');$('sort').value=m?.sort_order??0;$('friday').checked=m?.friday_prayer??true;$('active').checked=m?.active??true;$('form-panel').scrollIntoView({behavior:'smooth'})}
$('new-btn').onclick=()=>open(null);$('cancel-btn').onclick=$('cancel2').onclick=()=>$('form-panel').classList.add('hidden');
async function upload(file,folder){if(!file)return null;if(file.size>10*1024*1024)throw Error('الملف أكبر من 10MB');let ext=(file.name.split('.').pop()||'dat').replace(/[^a-z0-9]/gi,''),path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;let r=await db.storage.from('mosque-media').upload(path,file,{contentType:file.type});if(r.error)throw r.error;return db.storage.from('mosque-media').getPublicUrl(path).data.publicUrl}
$('mosque-form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{let id=$('mid').value,old=rows.find(m=>m.id===id)||{},photo=await upload($('photo').files[0],'mosques'),ip=await upload($('imam-photo').files[0],'imams'),audio=await upload($('audio').files[0],'recitations');let row={name:$('name').value.trim(),city:$('city').value.trim()||'الدمام',district:$('district').value.trim()||null,address:$('address').value.trim()||null,latitude:$('lat').value?Number($('lat').value):null,longitude:$('lng').value?Number($('lng').value):null,imam_name:$('imam').value.trim()||null,qiyam_start_time:$('qiyam').value.trim()?('رمضان فقط — '+$('qiyam').value.trim()):null,sort_order:Number($('sort').value)||0,friday_prayer:$('friday').checked,active:$('active').checked,image_url:photo||old.image_url||null,imam_photo_url:ip||old.imam_photo_url||null,recitation_url:audio||old.recitation_url||null,updated_at:new Date().toISOString()};let r=id?await db.from('mosques').update(row).eq('id',id):await db.from('mosques').insert(row);if(r.error)throw r.error;$('form-panel').classList.add('hidden');msg('admin-msg','تم حفظ بيانات المسجد بنجاح');await dashboard()}catch(err){msg('admin-msg','تعذّر الحفظ: '+err.message,true)}finally{$('save').disabled=false}};
async function del(id){let m=rows.find(x=>x.id===id);if(!m||!confirm('حذف مسجد '+m.name+'؟'))return;let r=await db.from('mosques').delete().eq('id',id);if(r.error){msg('admin-msg',r.error.message,true);return}msg('admin-msg','تم حذف المسجد');await dashboard()}
db.auth.getSession().then(r=>{if(r.data.session){user=r.data.session.user;dashboard()}});
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;$('dashboard').classList.add('hidden');$('login-panel').classList.remove('hidden')}});
</script></body></html>

name: Deploy Ant Al-Bidaya
on:
  push:
    branches: [main]
    paths:
      - "ant-albidaya/**"
      - ".github/workflows/deploy-ant-albidaya.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-ant-albidaya"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare clean Pages directory
        run: |
          mkdir -p _site
          cp -Lr ant-albidaya/. _site/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

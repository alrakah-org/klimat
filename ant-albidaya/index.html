<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أنت البداية | شاشة العرض</title><link rel="icon" href="logo.svg"><style>
:root{--navy:#20465e;--teal:#159c9d;--orange:#f07832;--gold:#f5b936}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#285a70,#17384d 65%,#102b3d);color:white;font-family:Tahoma,Arial,sans-serif;overflow:hidden}header{height:82px;padding:9px 2.5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff22}header img{width:145px;height:68px;object-fit:contain;border-radius:10px}.tag{color:#c8dce2;font-size:clamp(12px,1vw,17px)}h1{text-align:center;margin:14px 0 3px;font-size:clamp(23px,2.4vw,38px)}.sub{text-align:center;color:#c4d9df;margin:0;font-size:clamp(11px,1vw,16px)}#board{height:calc(100vh - 145px);display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:clamp(2px,.45vw,8px);padding:12px 1.5vw 20px;align-items:stretch}.student{min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.count{height:22px;color:#ffe09a;font-size:clamp(9px,.8vw,14px);font-weight:bold}.track{height:76%;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:2px solid #ffffff38}.bar{width:72%;height:0;min-height:4px;border-radius:10px 10px 3px 3px;background:linear-gradient(0deg,#159c9d,#55c5b4 62%,#f5b936);box-shadow:0 0 18px #159c9d55;transition:height .8s cubic-bezier(.2,.8,.2,1)}.student:nth-child(4n+2) .bar{background:linear-gradient(0deg,#e56d2d,#f5b936)}.student:nth-child(4n+3) .bar{background:linear-gradient(0deg,#148b91,#67d2c4)}.student:nth-child(4n) .bar{background:linear-gradient(0deg,#b77b20,#f5c85b)}.name{height:58px;padding:7px 1px 0;text-align:center;font-size:clamp(9px,.78vw,14px);font-weight:bold;line-height:1.35;overflow-wrap:anywhere;display:flex;align-items:flex-start;justify-content:center}.foot{text-align:center;color:#a9c6cf;font-size:11px;padding:0 8px}@media(max-width:700px){body{overflow:auto}#board{min-width:1000px;height:calc(100vh - 145px)}}
</style></head><body><header><img src="logo.svg" alt="أنت البداية"><div class="tag">رحلة حفظ الحديث النبوي</div></header><h1>سباق التميّز</h1><p class="sub">كل حديث خطوة نحو القمّة</p><main id="board"></main><div class="foot" id="state">شاشة عرض مباشرة</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(window.ANT_ALBIDAYA_SUPABASE_URL,window.ANT_ALBIDAYA_SUPABASE_KEY);let students=[],showCounts=false;const board=document.getElementById('board');
function draw(){const max=Math.max(10,...students.map(s=>Number(s.hadith_count)||0));board.innerHTML='';students.sort((a,b)=>a.name.localeCompare(b.name,'ar')).forEach(s=>{const v=Number(s.hadith_count)||0,card=document.createElement('div');card.className='student';const c=document.createElement('div');c.className='count';c.textContent=showCounts?v:'';const track=document.createElement('div');track.className='track';const bar=document.createElement('div');bar.className='bar';bar.style.height=(v?Math.max(3,v/max*100):0)+'%';track.append(bar);const n=document.createElement('div');n.className='name';n.textContent=s.name;card.append(c,track,n);board.append(card)})}
async function load(){const [a,b]=await Promise.all([sb.from('students').select('*'),sb.from('app_settings').select('show_counts').eq('id',1).single()]);if(a.error||b.error){document.getElementById('state').textContent='تعذّر تحميل البيانات';return}students=a.data||[];showCounts=b.data.show_counts;draw();sb.channel('ant-display').on('postgres_changes',{event:'*',schema:'public',table:'students'},async()=>{const r=await sb.from('students').select('*');if(!r.error){students=r.data||[];draw()}}).on('postgres_changes',{event:'*',schema:'public',table:'app_settings'},async()=>{const r=await sb.from('app_settings').select('show_counts').eq('id',1).single();if(!r.error){showCounts=r.data.show_counts;draw()}}).subscribe()}
load();
</script></body></html>
